<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✨ Fantasy Particle Canvas | Interactive Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Prevent text selection for smooth drawing */
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f2a, #030617);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'SF Pro Display', system-ui, -apple-system, 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none; /* Optimize touch experience, prevent scrolling interference */
        }

        /* Main canvas container */
        .canvas-container {
            position: relative;
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.05) inset, 0 0 0 4px rgba(0, 0, 0, 0.2);
            background: #00000020;
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 1.8rem;
            cursor: crosshair;
            touch-action: none;
            background: radial-gradient(ellipse at 30% 40%, #101624, #02040c);
        }

        /* Cool control bar */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            padding: 12px 20px;
            background: rgba(10, 20, 35, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            margin: 0 auto;
            width: fit-content;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            z-index: 20;
        }

        button {
            background: rgba(20, 30, 55, 0.9);
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: inherit;
            color: #f0f3ff;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        button i {
            font-style: normal;
            display: inline-block;
            transition: transform 0.2s;
        }

        button:hover {
            background: #2e3b6e;
            transform: scale(1.02);
            border-color: rgba(255, 200, 100, 0.6);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.96);
        }

        .color-picker-wrap {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 0 10px;
            border-radius: 40px;
            gap: 8px;
            backdrop-filter: blur(4px);
        }

        .color-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #ddd;
        }

        input[type="color"] {
            width: 36px;
            height: 36px;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            padding: 0;
            outline: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.3);
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 0 14px;
            border-radius: 40px;
        }

        .size-value {
            min-width: 38px;
            text-align: center;
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        input[type="range"] {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            background: #5b6e8c;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffdf80;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 4px #ffc107;
        }

        /* Tip label */
        .tip {
            position: absolute;
            top: 16px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #ccd6f0;
            font-weight: 500;
            pointer-events: none;
            z-index: 20;
            font-family: monospace;
            letter-spacing: 0.5px;
            border-left: 3px solid #ffaa44;
        }

        @media (max-width: 700px) {
            .controls { gap: 8px; padding: 8px 14px; }
            button { padding: 6px 12px; font-size: 0.75rem; }
            .size-control { padding: 0 8px; }
            .color-label { font-size: 0.7rem; }
            .tip { font-size: 0.6rem; top: 10px; left: 12px; }
        }
    </style>
</head>
<body>
<div>
    <div class="canvas-container">
        <canvas id="magicCanvas" width="1000" height="600" style="width: 100%; height: auto; max-width: 1200px; aspect-ratio: 1000/600"></canvas>
        <div class="controls">
            <div class="color-picker-wrap">
                <span class="color-label">🎨 Streamer</span>
                <input type="color" id="penColor" value="#ff66cc">
            </div>
            <div class="size-control">
                <span>✍️ Brush</span>
                <input type="range" id="penSize" min="2" max="35" step="1" value="12">
                <span id="sizeValueDisplay" class="size-value">12</span>
            </div>
            <button id="clearBtn"><i>🧹</i> Clear Canvas</button>
            <button id="rainbowModeBtn"><i>🌈</i> Rainbow Fall</button>
            <button id="boomBtn"><i>💥</i> Particle Burst</button>
        </div>
        <div class="tip">
            ✨ Drag mouse/finger → beautiful particle trails | Rainbow mode auto-fades | Explosive surprise!
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- Get elements ----------
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set actual resolution (ensure clarity)
        function resizeCanvas() {
            // Logical fixed aspect ratio 1000x600, adapt to CSS display
            const w = 1000;
            const h = 600;
            canvas.width = w;
            canvas.height = h;
            initBackground();
        }
        
        // Draw deep colorful gradient background (deep starry sky style, for reset)
        function initBackground() {
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#050b1a');
            grad.addColorStop(0.5, '#121b2f');
            grad.addColorStop(1, '#030617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars();
        }
        
        // Draw some twinkling stars for atmosphere (does not erase existing drawing, only background)
        function drawStars() {
            for(let i = 0; i < 300; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = Math.random() * 1.5;
                const alpha = Math.random() * 0.5 + 0.2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 240, 200, ${alpha})`;
                ctx.fill();
            }
            for(let i=0;i<60;i++) {
                ctx.beginPath();
                ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*2+0.8, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 215, 140, ${Math.random()*0.8+0.3})`;
                ctx.fill();
            }
        }
        
        // ---- Particle system core ----
        let particles = [];            // Store all active particles
        let animationId = null;
        let isDrawing = false;
        
        // Drawing parameters
        let currentColor = '#ff66cc';
        let currentSize = 12;
        let rainbowActive = false;     // Rainbow mode toggle
        let rainbowHue = 0;
        
        // Get DOM elements and bind events
        const penColorInput = document.getElementById('penColor');
        const penSizeSlider = document.getElementById('penSize');
        const sizeDisplay = document.getElementById('sizeValueDisplay');
        const clearBtn = document.getElementById('clearBtn');
        const rainbowModeBtn = document.getElementById('rainbowModeBtn');
        const boomBtn = document.getElementById('boomBtn');
        
        // Listen for normal brush color changes
        penColorInput.addEventListener('input', (e) => {
            currentColor = e.target.value;
            if(rainbowActive) {
                rainbowActive = false;
                rainbowModeBtn.textContent = '🌈 Rainbow Fall';
                rainbowModeBtn.style.background = "rgba(20,30,55,0.9)";
            }
        });
        
        penSizeSlider.addEventListener('input', (e) => {
            currentSize = parseInt(e.target.value);
            sizeDisplay.innerText = currentSize;
        });
        
        // Rainbow mode toggle
        rainbowModeBtn.addEventListener('click', () => {
            rainbowActive = !rainbowActive;
            if(rainbowActive) {
                rainbowModeBtn.textContent = '🎨 Solid Color';
                rainbowModeBtn.style.background = "#6a2e6e";
            } else {
                rainbowModeBtn.textContent = '🌈 Rainbow Fall';
                rainbowModeBtn.style.background = "rgba(20,30,55,0.9)";
                currentColor = penColorInput.value;
            }
        });
        
        // Clear canvas (reset beautiful background and remove all particles)
        clearBtn.addEventListener('click', () => {
            particles = [];
            initBackground();
        });
        
        // Particle explosion effect: Generate a large number of colorful particles randomly, spreading outward
        boomBtn.addEventListener('click', () => {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const count = 320;
            for(let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const radius = Math.random() * 7 + 2;
                const hue = (Math.random() * 360);
                const sat = 70 + Math.random() * 30;
                const light = 60 + Math.random() * 30;
                const color = `hsl(${hue}, ${sat}%, ${light}%)`;
                particles.push({
                    x: centerX + (Math.random() - 0.5) * 80,
                    y: centerY + (Math.random() - 0.5) * 80,
                    vx: vx,
                    vy: vy,
                    size: radius,
                    alpha: 1,
                    color: color,
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.02,
                    isExplodeParticle: true
                });
            }
            for(let i=0;i<80;i++) {
                particles.push({
                    x: centerX + (Math.random() - 0.5) * 160,
                    y: centerY + (Math.random() - 0.5) * 160,
                    vx: (Math.random() - 0.5)*9,
                    vy: (Math.random() - 0.5)*9,
                    size: Math.random() * 6 + 1.5,
                    alpha: 1,
                    color: `hsl(${Math.random()*360}, 90%, 65%)`,
                    life: 1,
                    decay: 0.02,
                    isExplodeParticle: true
                });
            }
        });
        
        // Add drawing particle (based on mouse/touch trajectory)
        function addParticleAt(x, y, forceColor = null) {
            let finalColor = forceColor;
            if(!finalColor) {
                if(rainbowActive) {
                    rainbowHue = (rainbowHue + 4) % 360;
                    finalColor = `hsl(${rainbowHue}, 85%, 65%)`;
                } else {
                    finalColor = currentColor;
                }
            }
            
            const sizeVar = currentSize * (0.8 + Math.random() * 0.7);
            const particleCount = Math.min(4, Math.floor(currentSize / 6) + 2);
            for(let i=0; i<particleCount; i++) {
                const offX = (Math.random() - 0.5) * currentSize * 0.6;
                const offY = (Math.random() - 0.5) * currentSize * 0.6;
                let satColor = finalColor;
                if(rainbowActive) {
                    const shift = (Math.random() - 0.5)*25;
                    let newHue = (rainbowHue + shift + 360) % 360;
                    satColor = `hsl(${newHue}, 85%, 68%)`;
                } else if(Math.random() > 0.7) {
                    satColor = `#ffd966`;
                }
                particles.push({
                    x: x + offX,
                    y: y + offY,
                    vx: (Math.random() - 0.5) * 2.2,
                    vy: (Math.random() - 0.5) * 2.0 - 0.5,
                    size: sizeVar * (0.4 + Math.random() * 0.8),
                    alpha: 0.95,
                    color: satColor,
                    life: 1.0,
                    decay: 0.018 + Math.random() * 0.025,
                    isExplodeParticle: false
                });
            }
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 1.0,
                vy: (Math.random() - 0.5) * 1.0 - 0.3,
                size: currentSize * 0.6,
                alpha: 1,
                color: finalColor,
                life: 1.0,
                decay: 0.022,
                isExplodeParticle: false
            });
        }
        
        // ---- Mouse/touch event listeners ----
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if(e.touches) {
                if(e.touches.length === 0) return null;
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            canvasX = Math.min(Math.max(0, canvasX), canvas.width);
            canvasY = Math.min(Math.max(0, canvasY), canvas.height);
            return { x: canvasX, y: canvasY };
        }
        
        let lastDrawPoint = null;
        
        function startDraw(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getCanvasCoords(e);
            if(pos) {
                addParticleAt(pos.x, pos.y);
                lastDrawPoint = pos;
            }
        }
        
        function drawMove(e) {
            e.preventDefault();
            if(!isDrawing) return;
            const pos = getCanvasCoords(e);
            if(!pos) return;
            if(lastDrawPoint) {
                const dist = Math.hypot(pos.x - lastDrawPoint.x, pos.y - lastDrawPoint.y);
                if(dist > 6) {
                    const steps = Math.min(20, Math.floor(dist / 3));
                    for(let s=1; s<=steps; s++) {
                        const t = s / steps;
                        const ix = lastDrawPoint.x + (pos.x - lastDrawPoint.x) * t;
                        const iy = lastDrawPoint.y + (pos.y - lastDrawPoint.y) * t;
                        addParticleAt(ix, iy);
                    }
                } else {
                    addParticleAt(pos.x, pos.y);
                }
            } else {
                addParticleAt(pos.x, pos.y);
            }
            lastDrawPoint = pos;
        }
        
        function endDraw(e) {
            e.preventDefault();
            isDrawing = false;
            lastDrawPoint = null;
        }
        
        canvas.addEventListener('mousedown', startDraw);
        window.addEventListener('mousemove', drawMove);
        window.addEventListener('mouseup', endDraw);
        canvas.addEventListener('touchstart', startDraw, {passive: false});
        canvas.addEventListener('touchmove', drawMove, {passive: false});
        canvas.addEventListener('touchend', endDraw);
        canvas.addEventListener('touchcancel', endDraw);
        
        // ------- Animation loop: update particles and render -------
        function updateParticles() {
            for(let i=0; i<particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                p.alpha = p.life * 0.9;
                p.vx *= 0.99;
                p.vy *= 0.99;
                p.vy += 0.08;
                if(p.x + p.size < -50 || p.x - p.size > canvas.width + 50 || p.y + p.size < -50 || p.y - p.size > canvas.height + 100 || p.life <= 0.02) {
                    particles.splice(i,1);
                    i--;
                }
            }
        }
        
        function renderParticles() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(3, 6, 23, 0.28)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if(Math.random() < 0.05) {
                for(let i=0;i<12;i++){
                    ctx.beginPath();
                    ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*2, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, 220, 150, ${Math.random()*0.5})`;
                    ctx.fill();
                }
            }
            
            for(const p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI*2);
                ctx.shadowBlur = p.size * 1.2;
                ctx.shadowColor = p.color;
                ctx.globalAlpha = Math.min(p.alpha * 0.9, 0.85);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x - p.size*0.1, p.y - p.size*0.1, p.size*0.25, 0, Math.PI*2);
                ctx.fillStyle = "#fff9e0";
                ctx.globalAlpha = p.alpha * 0.6;
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
            
            for(let i=0; i<particles.length; i++) {
                const p = particles[i];
                if(p.size > 6 && p.alpha > 0.4) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size*0.4, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, 200, 100, ${p.alpha*0.5})`;
                    ctx.fill();
                }
            }
        }
        
        function animate() {
            updateParticles();
            renderParticles();
            requestAnimationFrame(animate);
        }
        
        resizeCanvas();
        initBackground();
        
        function welcomeFireworks() {
            for(let i=0;i<180;i++) {
                const angle = Math.random() * Math.PI * 2;
                const rad = Math.random() * 180;
                const x = canvas.width/2 + Math.cos(angle) * rad;
                const y = canvas.height/2 + Math.sin(angle) * rad * 0.7;
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5)*1.8,
                    vy: (Math.random() - 0.5)*1.5 - 0.5,
                    size: Math.random() * 7 + 2,
                    alpha: 1,
                    color: `hsl(${Math.random()*360}, 85%, 65%)`,
                    life: 1,
                    decay: 0.012,
                    isExplodeParticle: true
                });
            }
        }
        setTimeout(() => {
            welcomeFireworks();
        }, 100);
        
        animate();
        
        window.addEventListener('resize', () => {
            // Maintain aspect ratio, no content reset needed
        });
    })();
</script>
</body>
</html>
